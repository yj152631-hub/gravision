{% extends 'base.html' %}
{% block content %}
<!-- 부드럽게 스르륵 나타나는 메인 인트로 애니메이션 -->
<div class="intro-section" style="animation: fadeIn 1.5s ease-out;">
    
    <!-- 메인 타이틀 -->
    <h1 class="intro-title" style="margin-bottom: 15px;">
        THE GRAND CINEMA
    </h1>
    
    <!-- 고급스러운 샴페인 골드 실선 디테일 추가 -->
    <div style="width: 40px; height: 1px; background-color: var(--luxury-gold); margin: 0 auto 25px auto;"></div>
    
    <!-- 한글 서브 타이틀 (인라인 스타일을 줄이고 CSS의 명조체를 자연스럽게 따르도록 수정) -->
    <!-- 한국어 문장이므로 대문자 변환(uppercase)을 해제하여 깔끔하게 출력합니다 -->
    <p class="intro-sub" style="font-size: 1.05rem; letter-spacing: 2px; text-transform: none; color: #999;">
        당신의 지금 이 순간에 가장 완벽하게 어울리는 작품을 배정해 드립니다.
    </p>
    
    <!-- 프론트 데스크 체크인 벨 -->
    <div class="bell-wrapper" onclick="location.href='/survey'" style="margin-top: 30px;">
        <!-- 사용하시는 기본 종 이미지가 이전에 CSS로 설정한 140px 크기로 큼직하고 우아하게 나타납니다 -->
        <img src="{{ url_for('static', filename='intro_bell_default.png') }}" alt="Concierge Bell">
        <div class="ring-text">Ring to Check-in</div>
    </div>
    
</div>
{% endblock %}
